services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: 'Australia/Sydney'
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
    volumes:
      - /data/pihole/etc-pihole:/etc/pihole
      - /data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      - caddy_net
    restart: unless-stopped

networks:
  caddy_net:
    external: true