services:
  ghostfolio:
    image: ghostfolio/ghostfolio:3.76.0
    container_name: ghostfolio
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ghostfolio-db:5442/${POSTGRES_DB}?connect_timeout=300
      - REDIS_HOST=ghostfolio-redis
      - REDIS_PORT=6379
      - ACCESS_TOKEN_SALT=${ACCESS_TOKEN_SALT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - NODE_ENV=production
    networks:
      - caddy_net
      - ghostfolio_internal
    depends_on:
      ghostfolio-db:
        condition: service_healthy
      ghostfolio-redis:
        condition: service_healthy

  ghostfolio-db:
    image: postgres:15-alpine
    container_name: ghostfolio-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /data/ghostfolio-db:/var/lib/postgresql/data
    networks:
      - ghostfolio_internal
    command: -p 5442
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER} -p 5442"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghostfolio-redis:
    image: redis:7-alpine
    container_name: ghostfolio-redis
    restart: unless-stopped
    networks:
      - ghostfolio_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  caddy_net:
    external: true
  ghostfolio_internal:
    external: false